# TorBox / debrid CDN -> GitHub Releases, zero local disk.
#
# SECRET FLOW: a human (or an agent-side mint script) puts the download link
# into this repo's own settings: Settings -> Secrets and variables -> Actions
# -> New repository secret. Name: SOURCE_URL. The link never appears in chat,
# git, or this file. GitHub injects it as an env var and masks it in logs;
# range_list.py never prints it (host only).
#
# Optional second secret, only when the target release lives in a DIFFERENT
# (private) repo than this runner repo:
#   TARGET_PAT  fine-grained PAT scoped to that repo, Contents: RW.
# Repo variables: TARGET_REPO (default: this repo), RELEASE_TAG
# (default: range-pull-v1).
#
# TRIGGER (slice-lane v2): the dispatch API needs a workflow-scoped token,
# which this operation's token does not have — so runs are requested by
# COMMITTING a control file under runs/ (git push = Contents permission,
# which works, and every run request stays auditable in git history):
#   runs/<timestamp>-<mode>.json containing:
#   {"mode":"list"|"extract-one"|"slice-upload",
#    "match":"<name-or-suffix, extract-one only>",
#    "slice_size":"2000000000",
#    "slice_starts":["0","2000000000", ...]}
# The newest runs/*.json in the pushed tree wins. workflow_dispatch is kept
# for any future properly-scoped token. Runs are NOT serialized (see the
# concurrency note above the permissions block).

name: torbox-range

on:
  push:
    branches: [main]
    paths: ["runs/*.json"]
  workflow_dispatch:
    inputs:
      mode:
        description: "list / extract-one / slice-upload"
        type: choice
        options: [list, extract-one, slice-upload, repair-companions]
        default: list
      match:
        description: "extract-one: file name or suffix inside the zip"
        type: string
        default: ""
      slice_size:
        description: "slice-upload: bytes per release asset (default 100 MB standard; < 2 GiB hard limit)"
        type: string
        default: "100000000"
      slice_starts:
        description: "slice-upload: JSON list of byte offsets"
        type: string
        default: '["0"]'

# NOTE (slice lane, 2026-10-20): no concurrency group. Run 39479148383's jobs
# fail deterministically at the upload step and the run cannot be cancelled
# with this token (Actions write is 403) — a group would queue the fixed run
# behind ~85 minutes of doomed jobs. Runs are independent per-slice and the
# skip logic makes overlaps safe.
permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.cfg.outputs.mode }}
      match: ${{ steps.cfg.outputs.match }}
      slice_size: ${{ steps.cfg.outputs.slice_size }}
      slice_starts: ${{ steps.cfg.outputs.slice_starts }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve run config (newest runs/*.json, or dispatch inputs)
        id: cfg
        env:
          D_MODE: ${{ inputs.mode }}
          D_MATCH: ${{ inputs.match }}
          D_SIZE: ${{ inputs.slice_size }}
          D_STARTS: ${{ inputs.slice_starts }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            F=$(ls runs/*.json | sort | tail -1)
            echo "control file: $F"
            echo "mode=$(jq -r .mode "$F")" >> "$GITHUB_OUTPUT"
            echo "match=$(jq -r .match // "" "$F")" >> "$GITHUB_OUTPUT"
            echo "slice_size=$(jq -r .slice_size // "100000000" "$F")" >> "$GITHUB_OUTPUT"
            echo "slice_starts=$(jq -c .slice_starts // ["0"] "$F")" >> "$GITHUB_OUTPUT"
          else
            echo "mode=$D_MODE" >> "$GITHUB_OUTPUT"
            echo "match=$D_MATCH" >> "$GITHUB_OUTPUT"
            echo "slice_size=$D_SIZE" >> "$GITHUB_OUTPUT"
            echo "slice_starts=$D_STARTS" >> "$GITHUB_OUTPUT"
          fi

  list:
    needs: prepare
    if: ${{ needs.prepare.outputs.mode == 'list' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Runner headroom (streaming needs ~0 of this)
        run: df -h . && free -h && python3 --version
      - name: Read zip central directory via Range (secret URL)
        env:
          SOURCE_URL: ${{ secrets.SOURCE_URL }}
        run: python3 range_list.py list --out manifest.json --limit 20
      - name: Keep the manifest
        uses: actions/upload-artifact@v4
        with:
          name: zip-manifest
          path: manifest.json
          retention-days: 7

  transfer:
    needs: prepare
    if: ${{ needs.prepare.outputs.mode == 'extract-one' || needs.prepare.outputs.mode == 'slice-upload' }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        slice_start: ${{ fromJSON(needs.prepare.outputs.slice_starts) }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve target release
        id: rel
        env:
          GH_TOKEN: ${{ secrets.TARGET_PAT || secrets.GITHUB_TOKEN }}
          TARGET_REPO: ${{ vars.TARGET_REPO || github.repository }}
          RELEASE_TAG: ${{ vars.RELEASE_TAG || 'range-pull-v1' }}
        run: |
          echo "repo=$TARGET_REPO" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          gh release view "$RELEASE_TAG" --repo "$TARGET_REPO" >/dev/null 2>&1 \
            || gh release create "$RELEASE_TAG" --repo "$TARGET_REPO" \
                 --title "$RELEASE_TAG" --notes "Streamed via Range, zero local disk."
          gh api "repos/$TARGET_REPO/releases/tags/$RELEASE_TAG" --jq .id > release_id.txt
          echo "id=$(cat release_id.txt)" >> "$GITHUB_OUTPUT"

      - name: extract-one — stream file from source zip straight to a release asset
        if: ${{ needs.prepare.outputs.mode == 'extract-one' }}
        env:
          SOURCE_URL: ${{ secrets.SOURCE_URL }}
          GH_TOKEN: ${{ secrets.TARGET_PAT || secrets.GITHUB_TOKEN }}
          TARGET_REPO: ${{ steps.rel.outputs.repo }}
          RELEASE_ID: ${{ steps.rel.outputs.id }}
          MATCH: ${{ needs.prepare.outputs.match }}
        run: |
          ASSET="$(basename "$MATCH")"
          python3 range_list.py extract-one "$MATCH" --out - > /dev/null
          python3 range_list.py extract-one "$MATCH" --out - \
            | curl -sS --fail -X POST \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Content-Type: application/octet-stream" \
                --data-binary @- \
                "https://uploads.github.com/repos/$TARGET_REPO/releases/$RELEASE_ID/assets?name=$ASSET"
          echo "uploaded asset: $ASSET"

      - name: slice-upload — stream one raw source slice straight to a release asset
        if: ${{ needs.prepare.outputs.mode == 'slice-upload' }}
        env:
          SOURCE_URL: ${{ secrets.SOURCE_URL }}
          GH_TOKEN: ${{ secrets.TARGET_PAT || secrets.GITHUB_TOKEN }}
          TARGET_REPO: ${{ steps.rel.outputs.repo }}
          RELEASE_ID: ${{ steps.rel.outputs.id }}
          START: ${{ matrix.slice_start }}
          SIZE: ${{ needs.prepare.outputs.slice_size }}
        run: |
          ASSET="slice-${START}-${SIZE}.bin"
          # Skip if an asset of this name+size already exists (resumable:
          # re-running after a link refresh only does the missing slices).
          EXISTING=$(gh api --paginate "repos/$TARGET_REPO/releases/$RELEASE_ID/assets?per_page=100" \
            | jq -rs --arg n "$ASSET" '[.[][] | select(.name==$n)] | first | .size // empty')
          if [ "$EXISTING" = "$SIZE" ]; then echo "already present, skip"; exit 0; fi
          # A wrong-size asset with this name (truncated earlier upload) would
          # make the re-upload 422 forever — delete it first. (Slice-lane patch.)
          if [ -n "$EXISTING" ]; then
            OLD_ID=$(gh api --paginate "repos/$TARGET_REPO/releases/$RELEASE_ID/assets?per_page=100" \
              | jq -rs --arg n "$ASSET" '[.[][] | select(.name==$n)] | first | .id // empty')
            echo "deleting wrong-size asset id $OLD_ID (was $EXISTING bytes)"
            gh api -X DELETE "repos/$TARGET_REPO/releases/assets/$OLD_ID"
          fi
          # Single pass: stream CDN range -> sha256 -> chunked POST to the
          # release, in-process. (The Lane 4 two-pass curl pipe died here:
          # 'curl: option --data-binary: out of memory' — curl buffers all of
          # stdin for @- bodies, so a 2 GiB slice OOMs the runner. Verified in
          # run 39479148383 job logs. upload-slice streams chunked, few MiB RAM,
          # and fetches the slice from the CDN once instead of twice.)
          export UPLOAD_URL="https://uploads.github.com/repos/$TARGET_REPO/releases/$RELEASE_ID/assets?name=$ASSET"
          python3 range_list.py upload-slice "$START" "$SIZE" --hash-out slice.sha256
          cat slice.sha256
          # Verify: size-exact check via API.
          GOT=$(gh api --paginate "repos/$TARGET_REPO/releases/$RELEASE_ID/assets?per_page=100" \
            | jq -rs --arg n "$ASSET" '[.[][] | select(.name==$n)] | first | .size // empty')
          [ "$GOT" = "$SIZE" ] && echo "SIZE VERIFIED: $GOT" || { echo "SIZE MISMATCH: got $GOT want $SIZE"; exit 1; }
          # Companion checksum asset: "<sha256>  <asset-name>" (feeds MANIFEST).
          SHA_ASSET="${ASSET}.sha256.txt"
          printf "%s  %s\n" "$(cat slice.sha256)" "$ASSET" > "$SHA_ASSET"
          OLD_SHA_ID=$(gh api --paginate "repos/$TARGET_REPO/releases/$RELEASE_ID/assets?per_page=100" \
            | jq -rs --arg n "$SHA_ASSET" '[.[][] | select(.name==$n)] | first | .id // empty')
          [ -n "$OLD_SHA_ID" ] && gh api -X DELETE "repos/$TARGET_REPO/releases/assets/$OLD_SHA_ID" || true
          curl -sS --fail -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: text/plain" \
            --data-binary @"$SHA_ASSET" \
            "https://uploads.github.com/repos/$TARGET_REPO/releases/$RELEASE_ID/assets?name=$SHA_ASSET"
          echo "checksum asset uploaded: $SHA_ASSET"

  repair:
    needs: prepare
    if: ${{ needs.prepare.outputs.mode == 'repair-companions' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        slice_start: ${{ fromJSON(needs.prepare.outputs.slice_starts) }}
    steps:
      - uses: actions/checkout@v4
      - name: Repair one slice's missing .sha256.txt companion
        env:
          GH_TOKEN: ${{ secrets.TARGET_PAT || secrets.GITHUB_TOKEN }}
          TARGET_REPO: ${{ vars.TARGET_REPO || github.repository }}
          RELEASE_TAG: ${{ vars.RELEASE_TAG || 'range-pull-v1' }}
          START: ${{ matrix.slice_start }}
          SIZE: ${{ needs.prepare.outputs.slice_size }}
        run: |
          ASSET="slice-${START}-${SIZE}.bin"
          SHA_ASSET="${ASSET}.sha256.txt"
          RID=$(gh api "repos/$TARGET_REPO/releases/tags/$RELEASE_TAG" --jq .id)
          HAVE_SHA=$(gh api --paginate "repos/$TARGET_REPO/releases/$RID/assets?per_page=100" \
            | jq -rs --arg n "$SHA_ASSET" '[.[][] | select(.name==$n)] | length')
          if [ "$HAVE_SHA" != "0" ]; then echo "companion present, skip"; exit 0; fi
          HAVE_BIN=$(gh api --paginate "repos/$TARGET_REPO/releases/$RID/assets?per_page=100" \
            | jq -rs --arg n "$ASSET" '[.[][] | select(.name==$n)] | first | .size // empty')
          [ "$HAVE_BIN" = "$SIZE" ] || { echo "bin missing/wrong size ($HAVE_BIN) — not repairable here"; exit 1; }
          # Hash the bytes AS STORED on the release (independent verification):
          # download this one asset to the runner disk (2 GiB fits), sha256 it,
          # upload the companion, clean up.
          gh release download "$RELEASE_TAG" --repo "$TARGET_REPO" --pattern "$ASSET" --dir .
          SHA=$(sha256sum "$ASSET" | cut -d" " -f1)
          printf "%s  %s\n" "$SHA" "$ASSET" > "$SHA_ASSET"
          curl -sS --fail -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: text/plain" \
            --data-binary @"$SHA_ASSET" \
            "https://uploads.github.com/repos/$TARGET_REPO/releases/$RID/assets?name=$SHA_ASSET"
          rm -f "$ASSET"
          echo "companion repaired: $SHA_ASSET ($SHA)"
